name: XCL Windows validation

on:
  push:
    branches: [validation/windows-msvc]

permissions:
  contents: read

jobs:
  validate:
    if: ${{ github.event.repository.fork && !github.event.repository.private }}
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: 0
      XCL_ADAPTER: warp
    steps:
      - name: Record workflow provenance
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP "xcl-windows-evidence"
          New-Item -Force -ItemType Directory -Path $evidence | Out-Null
          "EVIDENCE=$evidence" | Add-Content -LiteralPath $env:GITHUB_ENV
          "repository=$env:GITHUB_REPOSITORY workflow_sha=$env:GITHUB_SHA run_id=$env:GITHUB_RUN_ID attempt=$env:GITHUB_RUN_ATTEMPT" |
            Set-Content -LiteralPath "$evidence/workflow.txt"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify source pair and install Rust MSVC
        id: setup
        run: ./scripts/windows-validation/prepare.ps1

      - name: Measure native WARP capability
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        timeout-minutes: 5
        run: ./scripts/windows-validation/probe.ps1

      - name: Build and test baseline
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        timeout-minutes: 35
        run: ./scripts/windows-validation/validate.ps1 -Role baseline

      - name: Build and test candidate
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        timeout-minutes: 35
        run: ./scripts/windows-validation/validate.ps1 -Role candidate

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xcl-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/xcl-windows-evidence/
          retention-days: 7
          if-no-files-found: error
